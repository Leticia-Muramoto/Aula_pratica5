<!DOCTYPE html>
<html lang='pt-br'>
    <head>
        <meta charset="UTF-8">
        <Title>Formulário-Interativo</Title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/main.css">
        
    </head>
    <body>
        <header class="topbar">
        <h1 id="titulo">Formulário</h1>
        <p class="sub">Implementações de boas práticas ao aplicar JavaScript.</p>
        </header>

        <main class="conteiner">
            <section class="card">
                <h2>Cadastro</h2>
                <form action="#" method="post">
                    <fieldset>
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required maxlength="50"/>
                        <label for="estado">Estado:</label>
  
                        <select id="estado">
                            <option value="">-- Selecione o estado --</option>
                        </select>

                        <label for="cidade">Cidade:</label>
                        <select id="cidade" disabled>
                            <option value="">-- Selecione o estado primeiro --</option>
                        </select>
  
  


                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" />
                        <div id = "mensagemEmail" class="error-message" style="color: red;"></div>

                        <label for="password">Senha:</label>
                        <input type="password" id="senha" name="senha" minlength="6" required />

                        <label for="idade">Idade</label>
                        <input type="number" id="idade" name="idade" min="18" max="99">

                        <select name="curso" required="required">
                                <option value="">Escolha um curso</option>
                                <option value="engenharia_comp">Engenharia de computação</option>
                                <option value="Análise">Análise e desenvolvimento de sistemas</option> 
                                <option value="ciencia">Ciência da Computação</option>
                                <option value="engenharia_soft">Engenharia de Software</option> 
                                <option value="Sistemas">Sistemas de informação</option>  
                        </select>
                        
                        <button type="submit">Confirmar</button>
                    </fieldset>
                </form>
            </section>
        </main>
        
        <script src="../frontend/script/script.js"></script>
    </body>
</html>
