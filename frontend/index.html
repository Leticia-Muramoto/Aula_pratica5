<!DOCTYPE html>
<html lang='pt-br'>
    <head>
        <meta charset="UTF-8">
        <Title>Formulário-Interativo</Title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/main.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header class="topbar">
        <h1 id="titulo">Formulário</h1>
        <p class="sub">Implementações de boas práticas ao aplicar JavaScript.</p>
        </header>

        <main class="conteiner">
            <section class="card">
                <h2>Cadastro:</h2>
                <label for="nome">Nome:</label>

                <input type="text" id="nome" name="nome" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com"> <!-- Espelho no campo-->
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" minlength="6">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="18" max="99">
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
            
        </section> 

        </main>
    </body>
</html>
