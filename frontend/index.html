<!DOCTYPE html>
<html lang='pt-br'>
    <head>
        <meta charset="UTF-8">
        <Title>Formulário-Interativo</Title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/main.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header class="topbar">
        <h1 id="titulo">Formulário</h1>
        <p class="sub">Implementações de boas práticas ao aplicar JavaScript.</p>
        </header>

        <main class="conteiner">
            <section class="card">
            <h2 class="destaque">Criar conta</h2>
            <form action="#" method="post">
            <fieldset>
                <label for="nome">Nome:</label>
                <input id="nome" type="text" aria-describedby="ajuda-nome">
                <small id="ajuda-nome">Digite seu nome. Máx. 50 caracteres.</small>
            </fieldset>
            </section>
        </main>
    </body>
</html>
